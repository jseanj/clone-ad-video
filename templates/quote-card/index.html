<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>Quote Card Component</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .stage {
    width: 920px;
    background: rgba(14, 17, 22, 0.94);
    border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 36px;
    padding: 72px 64px;
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(24px);
    display: flex;
    flex-direction: column;
    gap: 36px;
  }

  .quote-mark {
    font-size: 80px;
    line-height: 0.6;
    color: #f59e0b;
    font-family: Georgia, serif;
    opacity: 0;
  }

  .quote-body {
    font-size: 44px;
    font-weight: 600;
    line-height: 1.35;
    color: #f8fafc;
    letter-spacing: -0.01em;
  }

  .line {
    display: block;
    opacity: 0;
    transform: translateY(24px);
  }

  .highlight {
    color: #fbbf24;
    position: relative;
    display: inline-block;
  }

  .stars {
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
  }

  .star {
    width: 38px;
    height: 38px;
    fill: #334155;
  }

  .star.filled {
    fill: #f59e0b;
  }

  .star.half {
    fill: url(#half-grad);
  }

  .score-num {
    color: #f8fafc;
    font-size: 32px;
    font-weight: 700;
    margin-left: 12px;
  }

  .author-row {
    display: flex;
    align-items: center;
    gap: 24px;
    margin-top: 12px;
    padding-top: 32px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    opacity: 0;
    transform: translateY(20px);
  }

  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6366f1, #a855f7);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    font-weight: 700;
    color: #ffffff;
  }

  .author-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .name {
    font-size: 30px;
    font-weight: 700;
    color: #f8fafc;
  }

  .role {
    font-size: 24px;
    font-weight: 500;
    color: #94a3b8;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="half-grad">
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#334155" />
    </linearGradient>
  </defs>
</svg>

<div class="stage">
  <div class="quote-mark">“</div>
  <div class="quote-body">
    <span class="line">We cut our reporting cycle from</span>
    <span class="line"><span class="highlight">two days down to 15 minutes</span>.</span>
    <span class="line">Our whole team cannot imagine going back.</span>
  </div>
  <div class="stars">
    <svg class="star filled" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
    <svg class="star filled" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
    <svg class="star filled" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
    <svg class="star filled" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
    <svg class="star half" viewBox="0 0 24 24"><polygon points="12,2 15,9 22,9 17,14 19,21 12,17 5,21 7,14 2,9 9,9"/></svg>
    <span class="score-num">4.8 / 5.0</span>
  </div>
  <div class="author-row">
    <div class="avatar">SC</div>
    <div class="author-meta">
      <div class="name">Sarah Chen</div>
      <div class="role">VP of Product Operations · FinTech Global</div>
    </div>
  </div>
</div>

<script>
  // Deterministic timeline controller for Chrome CDP capture
  const tl = gsap.timeline({ paused: true });

  tl.to(".quote-mark", { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1)
    .to(".line", {
      opacity: 1,
      y: 0,
      duration: 0.45,
      stagger: 0.22,
      ease: "power3.out"
    }, 0.25)
    .to(".stars", { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.1)
    .to(".author-row", {
      opacity: 1,
      y: 0,
      duration: 0.4,
      ease: "power2.out"
    }, 1.4);

  // Time parameter harness for deterministic frame capture (?t=1.5)
  const urlParams = new URLSearchParams(window.location.search);
  const seekTime = parseFloat(urlParams.get("t"));
  if (!isNaN(seekTime)) {
    tl.seek(seekTime);
  } else {
    tl.play();
  }
</script>
</body>
</html>
