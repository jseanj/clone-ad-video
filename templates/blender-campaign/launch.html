window.renderFrame=function(frame){const t=frame/C.fps;let caption=C.segments.find(s=>frame>=s.start&&frame<s.end);$('#caption').textContent=caption?caption.text:'';let scene=t<2.4?'hook':t<6.4?'tease':t<9.6?'reveal':t<19.2?'montage':'end';selectScene(scene);const end=scene==='end';$$('.top,.fine,.caption,.footer').forEach(el=>el.style.color=end?'#111416':'#f5f0e7');$('.bars').style.opacity=end?.3:.6;$('.scan').style.top=(300+((t*110)%1200))+'px';$('#phase').textContent=t<6.4?'A NEW SHAPE OF CREATION':'BLENDER 5.2 LTS';$$('.bars i').forEach((el,i)=>el.style.height=(4+19*(.5+.5*Math.sin(t*12+i*.7))*Math.exp(-((t%.4)*2)))+'px');

if(scene==='end'){const u=t-19.2;enter('#end .end-title',u);enter('#end .end-brand',u,.18);enter('#end .end-version',u,.32);enter('#end .end-link',u,.45)}$('#flash').style.opacity=t>=6.4&&t<6.62?.3*(1-(t-6.4)/.22):0;wipes(t,[2.4,9.6,19.2]);};window.renderFrame(0);
