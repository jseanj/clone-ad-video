<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
<title>End Card CTA</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .end-card {
    width: 900px;
    background: rgba(15, 23, 42, 0.95);
    border: 2px solid rgba(56, 189, 248, 0.3);
    border-radius: 40px;
    padding: 80px 60px;
    text-align: center;
    box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
    opacity: 0;
    transform: scale(0.92);
  }

  .brand-logo {
    font-size: 52px;
    font-weight: 900;
    letter-spacing: -0.03em;
    color: #f8fafc;
  }

  .tagline {
    font-size: 38px;
    color: #94a3b8;
    line-height: 1.3;
    max-width: 720px;
  }

  .cta-btn {
    margin-top: 16px;
    background: linear-gradient(135deg, #0284c7, #38bdf8);
    color: #ffffff;
    font-size: 38px;
    font-weight: 800;
    padding: 24px 64px;
    border-radius: 999px;
    box-shadow: 0 12px 30px rgba(2, 132, 199, 0.4);
    letter-spacing: -0.01em;
  }

  .disclaimer {
    font-size: 24px;
    color: #64748b;
  }
</style>
</head>
<body>

<div class="end-card">
  <div class="brand-logo">AURORA · REPORT</div>
  <div class="tagline">Save 2 hours every morning. Automate your metrics with one click.</div>
  <div class="cta-btn">Claim 14-Day Free Trial</div>
  <div class="disclaimer">No credit card required · Instant setup in 60s</div>
</div>

<script>
  const tl = gsap.timeline({ paused: true });

  tl.to(".end-card", {
    opacity: 1,
    scale: 1,
    duration: 0.45,
    ease: "power3.out"
  }, 0.1);

  const urlParams = new URLSearchParams(window.location.search);
  const seekTime = parseFloat(urlParams.get("t"));
  if (!isNaN(seekTime)) {
    tl.seek(seekTime);
  } else {
    tl.play();
  }
</script>
</body>
</html>
